name: zegel_app
description: Cross-platform GUI for the Zegel tamper-proof container format.
version: 1.2.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  zegel:
    path: ../lib
  file_picker: ^8.1.1
  desktop_drop: ^0.4.4
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true

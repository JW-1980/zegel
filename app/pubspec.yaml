name: zegel_app
description: Cross-platform GUI for the Zegel tamper-proof container format.
version: 1.4.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  zegel:
    path: ../lib
  file_picker: ^11.0.2
  desktop_drop: ^0.7.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.1
  share_plus: ^12.0.2
  url_launcher: ^6.2.1
  pinenacl: ^0.6.0
  shared_preferences: ^2.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
